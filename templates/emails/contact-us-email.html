<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>New Contact Form Submission</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px;">

  <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; padding: 24px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
    
    <h2 style="color: #2c3e50; margin-top: 0; border-bottom: 2px solid #3498db; padding-bottom: 10px;">
      New Website Inquiry
    </h2>

    <p style="font-size: 15px; color: #555555; line-height: 1.5;">
      Hello Admin,
    </p>
    <p style="font-size: 15px; color: #555555; line-height: 1.5;">
      You have received a new contact form message from <strong>{{ username }}</strong>.
    </p>

    <div style="background-color: #f8f9fa; border-left: 4px solid #3498db; padding: 15px; margin: 20px 0; border-radius: 4px;">
      <p style="margin: 0; font-size: 14px; color: #333333; line-height: 1.6;">
        Please check your admin panel or hit <strong>Reply</strong> in your email client to respond directly to <strong>{{ username }}</strong>.
      </p>
    </div>

    <p style="font-size: 12px; color: #888888; text-align: center; margin-top: 30px; border-top: 1px solid #eeeeee; padding-top: 15px;">
      This is an automated notification from your website's contact form.
    </p>

  </div>

</body>
</html>
